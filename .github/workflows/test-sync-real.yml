
name: Probar sincronizacion real

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: documental-vector-store-sync
  cancel-in-progress: false

jobs:
  test-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Autenticarse con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/583958599803/locations/global/workloadIdentityPools/github-actions-sync/providers/github-actions'
          service_account: 'agente-documental-sync@agente-documental-tic-511715.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Verificar y ejecutar sincronizacion
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
        run: |
          python - <<'PY'
          import json
          from app.services.sync_service import SyncService

          service = SyncService()

          # Revisar el estado antes de modificar nada.
          preview = service.preview()

          print("Simulacion previa:")
          print(json.dumps(
              {
                  "added": preview["added"],
                  "updated": preview["updated"],
                  "removed": preview["removed"],
                  "unchanged": len(preview["unchanged"])
              },
              indent=2,
              ensure_ascii=False
          ))

          if (
              preview["added"]
              or preview["updated"]
              or preview["removed"]
          ):
              raise RuntimeError(
                  "Se detectaron cambios en Drive. "
                  "Se cancela esta prueba de seguridad."
              )

          # Ejecutar la sincronizacion real.
          result = service.sync()
          stats = result["stats"]

          print("Resultado de sincronizacion:")
          print(json.dumps(
              stats,
              indent=2,
              ensure_ascii=False
          ))

          if (
              stats["added"] != 0
              or stats["updated"] != 0
              or stats["removed"] != 0
              or stats["unchanged"] != 6
              or stats["errors"]
          ):
              raise RuntimeError(
                  "La sincronizacion no produjo "
                  "el resultado esperado."
              )

          print(
              "Sincronizacion real completada "
              "sin modificar documentos."
          )
          PY
