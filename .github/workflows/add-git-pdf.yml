
name: Incorporar PDF de Git

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: documental-vector-store-sync
  cancel-in-progress: false

jobs:
  add-git-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Autenticarse con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/583958599803/locations/global/workloadIdentityPools/github-actions-sync/providers/github-actions'
          service_account: 'agente-documental-sync@agente-documental-tic-511715.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Incorporar nuevo PDF
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
        run: |
          python - <<'PY'
          import json
          from app.services.sync_service import SyncService

          service = SyncService()
          preview = service.preview()

          esperado = "Fundamentos_de_Git_Guia_Completa.pdf"

          if (
              preview["added"] != [esperado]
              or preview["updated"]
              or preview["removed"]
              or len(preview["unchanged"]) != 6
          ):
              raise RuntimeError(
                  "Estado inesperado. No se sincronizara."
              )

          print("PDF nuevo detectado correctamente.")

          result = service.sync()
          stats = result["stats"]

          print("Resultado:")
          print(json.dumps(
              stats,
              indent=2,
              ensure_ascii=False
          ))

          if (
              stats["added"] != 1
              or stats["updated"] != 0
              or stats["removed"] != 0
              or stats["unchanged"] != 6
              or stats["errors"]
          ):
              raise RuntimeError(
                  "La sincronizacion requiere revision."
              )

          final = service.preview()

          if (
              final["added"]
              or final["updated"]
              or final["removed"]
              or len(final["unchanged"]) != 7
          ):
              raise RuntimeError(
                  "No se verificaron los siete documentos."
              )

          print("Siete documentos sincronizados.")
          PY
