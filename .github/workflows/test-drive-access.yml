
name: Probar acceso a Google Drive

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Autenticarse con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/583958599803/locations/global/workloadIdentityPools/github-actions-sync/providers/github-actions'
          service_account: 'agente-documental-sync@agente-documental-tic-511715.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Comprobar acceso a Google Drive
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          from app.services.drive_service import DriveService

          folder_id = os.environ["GOOGLE_DRIVE_FOLDER_ID"]

          drive = DriveService()
          archivos = drive.list_files(folder_id)

          print("Conexion con Google Drive correcta.")
          print("Documentos encontrados:", len(archivos))

          for archivo in archivos:
              print("-", archivo["name"])

          if not archivos:
              raise RuntimeError(
                  "No se encontraron documentos. "
                  "Revisa el acceso de la cuenta de servicio."
              )

          print("Prueba finalizada correctamente.")
          PY
