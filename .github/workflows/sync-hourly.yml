
name: Sincronizacion automatica documental

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: documental-vector-store-sync
  cancel-in-progress: false

jobs:
  sync-documents:
    name: Sincronizar Google Drive con OpenAI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Autenticarse con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/583958599803/locations/global/workloadIdentityPools/github-actions-sync/providers/github-actions'
          service_account: 'agente-documental-sync@agente-documental-tic-511715.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Sincronizar documentos
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
          OPENAI_MODEL: gpt-5
        run: |
          python - <<'PY'
          import json
          from app.services.sync_service import SyncService

          print("Iniciando revision documental...")

          service = SyncService()

          preview = service.preview()

          summary = {
              "nuevos": len(preview["added"]),
              "modificados": len(preview["updated"]),
              "sin_cambios": len(preview["unchanged"]),
              "ausentes": len(preview["removed"])
          }

          print("Cambios detectados:")
          print(json.dumps(
              summary,
              indent=2,
              ensure_ascii=False
          ))

          # No continuar ante documentos desaparecidos.
          # Puede indicar un problema de permisos o lectura.
          if preview["removed"]:
              raise RuntimeError(
                  "Se detectaron documentos ausentes en Drive. "
                  "La sincronizacion se cancela para revision."
              )

          # Si no hay cambios, no realizar escrituras.
          if not preview["added"] and not preview["updated"]:
              print("No hay cambios pendientes.")
              print("Documentos conservados:", len(preview["unchanged"]))
              print("Sincronizacion finalizada correctamente.")
          else:
              print("Aplicando cambios...")

              result = service.sync()
              stats = result["stats"]

              print("Resultado:")
              print(json.dumps(
                  stats,
                  indent=2,
                  ensure_ascii=False
              ))

              if stats["errors"]:
                  raise RuntimeError(
                      "La sincronizacion reporto errores. "
                      "Revisa los registros."
                  )

              if stats["removed"] != 0:
                  raise RuntimeError(
                      "Se detectaron eliminaciones inesperadas."
                  )

              # Comprobar el estado despues de sincronizar.
              final = service.preview()

              if (
                  final["added"]
                  or final["updated"]
                  or final["removed"]
              ):
                  raise RuntimeError(
                      "Persisten cambios despues de sincronizar. "
                      "Se requiere revision."
                  )

              print("Sincronizacion completada correctamente.")
              print(
                  "Documentos actuales:",
                  len(final["unchanged"])
              )
          PY
